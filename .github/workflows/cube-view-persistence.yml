name: Movie Night cube view persistence regression
on:
  pull_request:
    paths:
      - 'web/filter-cubes.mjs'
      - 'verification/test-cube-view-persistence.cjs'
      - '.github/workflows/cube-view-persistence.yml'
  push:
    branches:
      - 'fix/cube-view-save-rollback-20261030'
    paths:
      - 'web/filter-cubes.mjs'
      - 'verification/test-cube-view-persistence.cjs'
      - '.github/workflows/cube-view-persistence.yml'
permissions:
  contents: read
jobs:
  cube-view-save:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24.22.1'
      - name: Real source function with isolated persistence hostiles
        run: node --test verification/test-cube-view-persistence.cjs
